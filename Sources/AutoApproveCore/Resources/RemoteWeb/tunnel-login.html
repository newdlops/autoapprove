<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow">
  <title>AutoApprove · 외부 접속</title>
  <link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/tunnel-login.css">
  <script src="/tunnel-login.js" defer></script>
</head><body>
  <main class="tunnel-login">
    <header><svg width="32" height="32" viewBox="0 0 28 28" fill="none" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="6" stroke="currentColor" stroke-width="1.5"/><path d="m7 8 5 5-5 5m8 0h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AutoApprove</span></header>
    <h1>내 Mac에 연결</h1>
    <p>Mac의 AutoApprove → 연결 설정 → 다른 네트워크에서 접속에 표시된 접속 키를 입력하세요. QR 코드나 접속 링크로도 연결할 수 있습니다.</p>
    <form id="tunnel-login-form">
      <label for="tunnel-key">접속 키</label>
      <input id="tunnel-key" name="access-key" type="password" required maxlength="256" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-describedby="tunnel-login-error">
      <p id="tunnel-login-error" class="error-text" role="alert" hidden></p>
      <button id="tunnel-login-submit" type="submit">Mac에 연결</button>
    </form>
    <p class="muted">연결하면 이 Mac과 연결된 Mac의 터미널을 보고 제어할 수 있습니다. 본인 기기에서만 연결하세요.</p>
    <noscript><p class="error-text">이 페이지에서 JavaScript를 허용한 뒤 다시 열어주세요.</p></noscript>
  </main>
</body></html>
